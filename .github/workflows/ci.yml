name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The project's deployment targets and Swift tools version need this exact Xcode.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  app:
    name: Build app (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, visionOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          xcodebuild build \
            -project CypherAir.xcodeproj \
            -scheme CypherAir \
            -destination 'generic/platform=${{ matrix.platform }}' \
            CODE_SIGNING_ALLOWED=NO

  vault:
    name: Test CypherVault
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test --package-path Packages/CypherVault
