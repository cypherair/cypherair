[package]
name = "pgp-mobile"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later OR MPL-2.0"
description = "OpenPGP wrapper for CypherAir iOS app, powered by Sequoia PGP"

[lib]
crate-type = ["lib", "staticlib"]
name = "pgp_mobile"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
sequoia-openpgp = { version = "=2.4.1", default-features = false, features = [
    "crypto-openssl",
    "compression-deflate",
] }
uniffi = { version = "0.32", features = ["cli"] }
openssl = { version = "0.10", features = ["vendored"] }
zeroize = { version = "1", features = ["derive"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
sequoia-openpgp = { version = "=2.4.1", default-features = false, features = [
    "crypto-openssl",
    "compression-deflate",
] }
# Fake Secure Enclave ML-KEM decapsulation in tests. Version-locked to the same
# ossl release sequoia-openpgp's crypto-openssl backend already pulls in, with
# the same feature shape (reuse the openssl-sys build instead of a second
# OpenSSL source tree).
ossl = { version = "1.5.2", default-features = false, features = ["openssl-sys"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[profile.release]
# Keep LTO and strip disabled: enabling either causes linker failures with the
# vendored OpenSSL static objects.
lto = false
strip = "none"
codegen-units = 1

# openssl-src comes from the CypherAir fork so the vendored OpenSSL has Apple
# arm64e Configure targets, which upstream OpenSSL lacks. The manifest tracks
# the carry branch; Cargo.lock pins the resolved commit.
[patch.crates-io]
openssl-src = { git = "https://github.com/cypherair/openssl-src-rs", branch = "carry/apple-arm64e-openssl-fork" }
